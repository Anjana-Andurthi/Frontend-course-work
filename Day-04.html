<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registeration Form </title>
</head>
<body>
    <center><h1>Student Registeration Form</h1></center>
</body>
<form style="border: 2px solid;background-color: darksalmon;" autocomplete="on">
    <label>Roll.No : </label>
    <input type="number"><br><br>

    <label>Student Name : </label>
    <input type="text" placeholder="First name">

    <input type="text" placeholder="last name"><br><br>

    <label>Father's Name : </label>
    <input type="text"><br><br>

    <label>DOB: </label>
    <input type="date"><br><br>

    <label>Mobile Number : </label>
    <input type="number" min="10" max="12"><br><br>

    <label>Email id : </label>
    <input type="email" required><br><br>

    <label>Password: </label>
    <input type="password" minlength="9" maxlength="12"><br><br>

     <label>Confirm Password: </label>
    <input type="password"><br><br>

    <label>Gender : </label>
    <input type="radio" name="radio"/>

    <label>Male </label>
    <input type="radio" name="radio">

    <label>Female </label>
    <input type="radio" name="radio">

    <label>Others </label><br><br>

    <label>Department : </label>
    <input type="checkbox">

    <label>CSE : </label>
    <input type="checkbox">

    <label>IT : </label>
    <input type="checkbox">

    <label>ECE: </label>
    <input type="checkbox">

    <label>Civil: </label>
    <input type="checkbox">

    <label>Mech : </label><br><br>

    <label>Course: </label>
    <select>
        <option>--Select current courses</option>
        <option>Python</option>
        <option>Java</option>
        <option>SQL</option>
        <option>HTML</option>
        <option>CSS</option>
    </select><br><br>
    <label>Student Photo: </label>
    <input type="file"/><br><br>

    <label>City: </label>
    <input type="text"><br><br>

    <label>Address: </label>
    <textarea></textarea><br><br>

    <center><button>Register</button ></center>


</form>
</html>
